[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dist-claims"
version = "0.1.0"
description = "Read-only Python distribution file and command ownership conflict reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
dist-claims = "dist_claims:main"

[project.urls]
Homepage = "https://github.com/KanadeK/dist-claims"
Issues = "https://github.com/KanadeK/dist-claims/issues"

[tool.setuptools]
py-modules = ["dist_claims"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
